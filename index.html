<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. B. Suresh Babu — Solar Astrophysicist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #fffbea; --text: #2a1f00; --muted: #7a6430; --border: #e8d89a; --accent: #c87a00; --card: #fff9d6; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }

  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 4rem 2rem 3rem; flex: 1; justify-content: center; }
  .hero-photo { width: 500px; height: 460px; object-fit: cover; object-position: 60% top; border-radius: 8px; margin-bottom: 1.75rem; display: block; }
  .hero h1 { font-family: 'EB Garamond', serif; font-size: 42px; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; letter-spacing: -0.5px; }
  .hero .jobtitle { font-size: 16px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
  .hero .institute { font-size: 14px; color: var(--muted); margin-bottom: 2.25rem; max-width: 420px; line-height: 1.5; }

  .nav-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .nav-buttons a { font-size: 14px; font-weight: 500; padding: 10px 28px; border: 1.5px solid var(--border); border-radius: 4px; color: var(--muted); text-decoration: none; background: var(--card); transition: all 0.15s; }
  .nav-buttons a:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  footer { padding: 2rem; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); width: 100%; text-align: center; }

  @media (max-width: 480px) {
    .hero-photo { width: 200px; height: 250px; }
    .hero h1 { font-size: 30px; }
    .nav-buttons a { padding: 9px 16px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="hero">
  <img class="hero-photo" src="photo.jpg" alt="Dr. B. Suresh Babu">
  <h1>Dr. B. Suresh Babu</h1>
  <div class="jobtitle">Postdoctoral Researcher</div>
  <div class="institute">Faculty of Science, University of South Bohemia České Budějovice</div>
  <div class="nav-buttons">
    <a href="about.html">About Me</a>
    <a href="publications.html">Publications</a>
    <a href="conferences.html">Conferences</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<footer>© 2026 Dr. B. Suresh Babu · Solar Astrophysicist</footer>
</body>
</html>
